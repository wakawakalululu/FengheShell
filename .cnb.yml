# CNB 云原生构建流水线：镜像 .github/workflows/ci.yml 的门禁
# （rustfmt + Clippy + 测试 + 构建检查 + npm audit）。
# GitHub Actions 工作流只在 GitHub 侧执行；CNB 侧由本文件驱动，
# push / PR 到 main 时自动触发（仓库设置已开 auto_trigger）。
# 两条流水线（rust / npm-audit）并行执行，与 ci.yml 的并行 job 对齐。
#
# Mirrors .github/workflows/ci.yml. The GitHub Actions workflows only run on
# the GitHub side; this file drives the CNB cloud-native build. Two pipelines
# (rust / npm-audit) run in parallel, matching ci.yml's parallel jobs.

main:
  push:
    - &rust-ci
      name: rust
      docker:
        image: rust:1
      env:
        CARGO_TERM_COLOR: always
      stages:
        # Slint (winit + femtovg) + rfd (GTK) + arboard need these system libs.
        # Same list as ci.yml. The container runs as root, so no sudo here
        # (unlike GitHub-hosted runners).
        - name: Install Linux GUI dependencies
          script: |
            apt-get update
            apt-get install -y --no-install-recommends \
              build-essential pkg-config cmake \
              libfontconfig1-dev libfreetype6-dev \
              libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
              libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
              libgl1-mesa-dev libegl1-mesa-dev libgtk-3-dev \
              libudev-dev
        # The official rust image ships the stable toolchain without these
        # components (ci.yml adds them via dtolnay/rust-toolchain).
        - name: Add rustfmt + clippy components
          script: rustup component add rustfmt clippy
        - name: rustfmt --check
          script: cargo fmt --all -- --check
        - name: clippy
          script: cargo clippy --workspace --all-targets -- -D warnings
        - name: test (workspace)
          script: cargo test --workspace
        - name: build check
          script: cargo build --workspace
    - &npm-audit-ci
      name: npm-audit
      docker:
        image: node:24
      stages:
        # The vendored rssh snapshot is reference-only, but its committed
        # package-lock.json is scanned by CNB code scanning - any published
        # advisory in the lock file must fail the build.
        - name: npm audit (rssh snapshot)
          script: |
            cd third_party/rssh
            npm audit
  pull_request:
    - *rust-ci
    - *npm-audit-ci
